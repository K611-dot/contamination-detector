[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contamination-detector"
version = "0.1.0"
description = "Toolkit for detecting benchmark/eval-data contamination in LLM training corpora"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kshitiz Singh" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8.0"]

[project.scripts]
contam-detect = "contamination_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
